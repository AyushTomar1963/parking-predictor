# Model Configuration

# LightGBM Model Settings
lightgbm:
  num_boost_round: 200
  params:
    objective: "regression"
    metric: "l2"
    learning_rate: 0.05
    max_depth: 7
    num_leaves: 31
    min_data_in_leaf: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    verbosity: -1
    seed: 42

# ARIMA Model Settings
arima:
  order: [1, 0, 0]  # (p, d, q)
  seasonal_order: [1, 1, 1, 24]  # (P, D, Q, s)
  trend: null
  enforce_stationarity: true
  enforce_invertibility: true

# Feature Engineering
features:
  lag_features: [1, 2, 3, 24, 48]  # hours to lag
  time_features:
    - "hour_of_day"
    - "day_of_week"
    - "is_weekend"
    - "month"
  rolling_windows: [3, 6, 12, 24]  # hours for rolling stats

# Training Configuration
training:
  test_size: 0.2  # 80/20 split
  validation_size: 0.1
  random_state: 42
  
# Forecasting
forecasting:
  max_horizon: 24  # hours
  direct_horizons: [1, 3, 6, 12, 24]
  recursive_max: 48
  
# Model Evaluation
evaluation:
  metrics:
    - "MAE"
    - "RMSE"
    - "MAPE"
  rolling_eval:
    initial_train_hours: 168  # 7 days
    step_hours: 24
    max_horizon: 24
